<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 72px;
    height: 72px;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #bubble {
    width: 64px;
    height: 64px;
    margin: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c7cff, #5b5be0);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    -webkit-app-region: drag; /* lets you drag it anywhere on screen */
    transition: transform 0.12s ease;
  }
  #bubble:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
  <div id="bubble" title="Prompt Forge — click to open, right-click for options">🙂</div>
  <script>
    const bubble = document.getElementById('bubble');

    // A plain click (no drag movement) still fires normally even inside
    // a drag region — that's what opens/closes the panel.
    bubble.addEventListener('click', () => {
      window.bubbleAPI.togglePanel();
    });

    // Right-click for Hide / Quit
    bubble.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.bubbleAPI.showContextMenu();
    });
  </script>
</body>
</html>
