<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 72px;
    height: 72px;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #bubble {
    width: 64px;
    height: 64px;
    margin: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c7cff, #5b5be0);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  #bubble:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>
  <div id="bubble" title="Prompt Forge — click to open, right-click for options">🙂</div>
  <script>
const bubble = document.getElementById('bubble');
        let dragging = false;
        let moved = false;
        let startScreenX = 0;
        let startScreenY = 0;

        bubble.addEventListener('mousedown', (e) => {
                dragging = true;
                moved = false;
                startScreenX = e.screenX;
                startScreenY = e.screenY;
        });

        window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const dx = e.screenX - startScreenX;
                const dy = e.screenY - startScreenY;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
                if (moved) {
                          window.bubbleAPI.moveWindowBy(dx, dy);
                          startScreenX = e.screenX;
                          startScreenY = e.screenY;
                }
        });

        window.addEventListener('mouseup', () => {
                if (dragging && !moved) {
                          window.bubbleAPI.togglePanel();
                }
                dragging = false;
                moved = false;
        });
    // Right-click for Hide / Quit
    bubble.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.bubbleAPI.showContextMenu();
    });
  </script>
</body>
</html>
